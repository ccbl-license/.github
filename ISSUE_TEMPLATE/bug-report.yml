name: 🐛 License Text Error / Format Issue
description: Report errors, ambiguities, or formatting problems in the CCBL license text
title: "[Bug] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for helping improve the CCBL license
        Please fill in the information below to help us locate the issue.

  - type: dropdown
    id: version
    attributes:
      label: License Version
      description: Which version does the issue affect?
      options:
        - 1.6 (current)
        - 1.5
        - 1.4
        - 1.3
        - Other (please specify below)
    validations:
      required: true

  - type: dropdown
    id: error-type
    attributes:
      label: Issue Type
      options:
        - Typo / Grammar error
        - Formatting (indentation, punctuation, line breaks)
        - Ambiguity or contradiction
        - Translation issue (Chinese vs English)
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: "Which section or line? (e.g., Section 0.4 'Qualification Process')"
      placeholder: Section 0.4 "Qualification Process"
    validations:
      required: true

  - type: textarea
    id: current-text
    attributes:
      label: Current Text
      description: Please paste the problematic text
      render: text
    validations:
      required: true

  - type: textarea
    id: suggested-text
    attributes:
      label: Suggested Fix
      description: What should it be changed to?
      render: text
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why is this change needed?
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have read and agree to the CCBL Contribution Terms (submission implies consent)
          required: true
